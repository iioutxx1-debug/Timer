name: build-apk
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      continue-on-error: true
      with:
        repository: iioutxx1-debug/Funland-
        path: assets-repo
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
    - name: Prepare web app
      run: |
        set -e
        PJ=$(find . -maxdepth 3 -name package.json -not -path '*/node_modules/*' -not -path './assets-repo/*' | head -1)
        if [ -n "$PJ" ] && node -e "var p=require('$PJ');process.exit(p.scripts&&p.scripts.build?0:1)"; then
          APPDIR=$(realpath "$(dirname "$PJ")")
          cd "$APPDIR"
          npm install
          npm run build -- --base=./
          WEB=dist
          [ -d dist ] || WEB=build
        else
          IDX=$(find . -maxdepth 3 -name index.html -not -path '*/node_modules/*' -not -path './assets-repo/*' | head -1)
          SRC=$(realpath "$(dirname "$IDX")")
          APPDIR=/tmp/_app
          mkdir -p "$APPDIR/www"
          cp -r "$SRC"/. "$APPDIR/www/"
          rm -rf "$APPDIR/www/.git" "$APPDIR/www/.github" "$APPDIR/www/assets-repo"
          cd "$APPDIR"
          npm init -y
          WEB=www
        fi
        echo "using $APPDIR ($WEB)"
        echo "APPDIR=$APPDIR" >> $GITHUB_ENV
        echo "WEB=$WEB" >> $GITHUB_ENV
    - name: Add Android
      run: |
        set -e
        cd "$APPDIR"
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share @capacitor/local-notifications
        cat > "$WEB/native-download.js" <<'EOF'
        (function(){
        var cap=window.Capacitor;
        if(!(cap&&cap.isNativePlatform&&cap.isNativePlatform()))return;
        function call(p,m,o){if(cap.nativePromise)return cap.nativePromise(p,m,o||{});if(cap.Plugins&&cap.Plugins[p])return cap.Plugins[p][m](o||{});return Promise.reject(new Error("plugin "+p));}
        function b64(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(",")[1]);};r.onerror=rej;r.readAsDataURL(b);});}
        function nm(n){var m=String(n||"").match(/\.(png|jpe?g|pdf|csv|json|txt)$/i);var d=String(n||"").replace(/[^0-9]+/g,"-").replace(/^-+|-+$/g,"");return "funland-"+(d||Date.now())+(m?m[0].toLowerCase():"");}
        async function handle(a){try{var blob=await (await fetch(a.href)).blob();var n=nm(a.download);var w=await call("Filesystem","writeFile",{path:n,data:await b64(blob),directory:"CACHE"});await call("Share","share",{title:n,files:[w.uri]});}catch(e){var m=String((e&&e.message)||e);if(m.toLowerCase().indexOf("cancel")<0){try{alert("تعذر الحفظ: "+m);}catch(x){}}}}
        function isDl(a){return a&&a.tagName==="A"&&a.hasAttribute("download")&&/^(blob|data):/.test(a.href);}
        var oc=HTMLAnchorElement.prototype.click;
        HTMLAnchorElement.prototype.click=function(){if(isDl(this)){handle(this);return;}return oc.apply(this,arguments);};
        var od=EventTarget.prototype.dispatchEvent;
        EventTarget.prototype.dispatchEvent=function(e){if(e&&e.type==="click"&&isDl(this)){handle(this);return true;}return od.apply(this,arguments);};
        document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[download]");if(a&&isDl(a)){e.preventDefault();handle(a);}},true);
        })();
        EOF
        sed -i 's#</head>#<script src="native-download.js"></script></head>#' "$WEB/index.html"
        npx cap init "منبه فن لاند" com.funland.alarm --web-dir "$WEB"
        npx cap add android
        sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml
        sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&<uses-permission android:name="android.permission.POST_NOTIFICATIONS" /><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" /><uses-permission android:name="android.permission.VIBRATE" /><uses-permission android:name="android.permission.WAKE_LOCK" />#' android/app/src/main/AndroidManifest.xml
    - name: Icons
      continue-on-error: true
      run: |
        cd "$APPDIR"
        mkdir -p assets
        unzip -q -o "$GITHUB_WORKSPACE/assets-repo/funland-android-1.zip" "funland-android/assets/*" -d /tmp/old
        cp /tmp/old/funland-android/assets/* assets/
        npm install -D @capacitor/assets
        npx capacitor-assets generate --android
    - name: Build APK
      run: |
        set -e
        cd "$APPDIR"
        npx cap sync android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create apk-${{ github.run_number }} "$APPDIR/android/app/build/outputs/apk/debug/app-debug.apk" --title Funland-APK --notes Funland-debug-APK
